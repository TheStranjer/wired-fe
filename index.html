<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <!-- WiredFE's own icon, a fixed file from public/ (decision 2). Declaring
         it also keeps browsers from probing /favicon.ico and logging a 404.
         The wired. prefix is deliberate: the hosting rule for
         /<any path>/wired.<hash>.* then serves the icon to pages at nested
         paths such as /oauth/authorize too. -->
    <link rel="icon" type="image/png" href="./wired.favicon.png" />
    <title>WIRED</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>WIRED requires JavaScript.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
